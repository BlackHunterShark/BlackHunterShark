<div align="center">

<svg width="700" height="150" viewBox="0 0 700 150" xmlns="http://www.w3.org/2000/svg"> 
  <defs> 
    <linearGradient id="g"> 
    <stop offset="25%" stop-color="#ff0080"> 
      <animate attributeName="stop-color" 
        values="#ff0080;#7b2cff;#00d4ff;#ff0080" 
        dur="4s" 
        repeatCount="indefinite"/> 
    </stop>
      <stop offset="50%" stop-color="#7b2cff"> 
        <animate attributeName="stop-color" 
          values="#7b2cff;#00d4ff;#ff0080;#7b2cff"
          dur="4s" repeatCount="indefinite"/> 
      </stop>
      <stop offset="100%" stop-color="#00d4ff"> 
        <animate attributeName="stop-color"
          values="#00d4ff;#ff0080;#7b2cff;#00d4ff"
          dur="4s" 
          repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    </defs>

<text x="350" y="95" 
  text-anchor="middle" 
  font-size="60" 
  font-family="Arial" 
  font-weight="bold" 
  fill="url(#g)">
Hinami Fuyji
  
</text>
  
</svg>
  
