<div align="center">

<svg width="700" height="150" viewBox="0 0 700 150" xmlns="http://www.w3.org/2000/svg"> 
  <defs> 
    <linearGradient id="g"  x1="0%" y1="0%" x2="100%" y2="0%"> 
    <stop offset="25%"> 
      <animate attributeName="stop-color" 
        values="#ff0080;#7b2cff;#00d4ff;#ff0080" 
        dur="4s" 
        repeatCount="indefinite"/> 
    </stop>
      <stop offset="50%"> 
        <animate attributeName="stop-color" 
          values="#7b2cff;#00d4ff;#ff0080;#7b2cff"
          dur="4s" repeatCount="indefinite"/> 
      </stop>
      <stop offset="100%"> 
        <animate attributeName="stop-color"
          values="#00d4ff;#ff0080;#7b2cff;#00d4ff"
          dur="4s" 
          repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    </defs>

<text x="350" y="95" 
  text-anchor="middle" 
  font-size="60" 
  font-family="Arial" 
  font-weight="bold" 
  fill="url(#g)">
Hinami Fuyji
  
</text>
  
</svg>
  
