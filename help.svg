<svg xmlns="http://www.w3.org/2000/svg" width="900" height="180" viewBox="0 0 900 180"> 
<defs> 
<linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="0%"> 
<stop offset="0%" stop-color="#ff0080"> 
<animate attributeName="stop-color" values="#ff0080;#7928ca;#00d4ff;#ff0080" 
dur="3s" repeatCount="indefinite"/> 
</stop>

  <stop offset="50%" stop-color="#7928ca">
    <animate attributeName="stop-color"
      values="#7928ca;#00d4ff;#ff0080;#7928ca"
      dur="3s"
      repeatCount="indefinite"/>
  </stop>

  <stop offset="100%" stop-color="#00d4ff">
    <animate attributeName="stop-color"
      values="#00d4ff;#ff0080;#7928ca;#00d4ff"
      dur="3s"
      repeatCount="indefinite"/>
  </stop>
</linearGradient>

</defs>

<text 
  x="450" 
  y="115" 
  text-anchor="middle"
  font-family="Arial, sans-serif" 
  font-size="72" 
  font-weight="bold" 
  fill="url(#gradient)">
Hinami Fuyji
  
</text>
  
</svg>


















