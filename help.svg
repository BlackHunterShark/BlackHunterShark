<stop offset="0%" stop-color="#692636"></stop>
  
<stop offset="25%" stop-color="#6B3938"></stop>

  <stop offset="50%" stop-color="#58705c"></stop>

  <stop offset="100%" stop-color="#275954"></stop>
    
</linearGradient>
